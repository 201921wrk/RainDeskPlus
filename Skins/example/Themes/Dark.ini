; RainDeskPlus 主题：Dark（深色基线，默认）
; 由 skin.ini / Dock.ini 的 [Theme] Name=Dark 声明引用，路径约定：<主文件目录>\Themes\<名>.ini
;
; 合并语义（D26-30）：主题文件是「低优先级默认值」——
;   主文件（skin.ini / Dock.ini）显式写出的同名键优先，主题文件只补主文件缺失的键。
;   因此主题可控的视觉项在主文件里不要再写死，否则会遮住主题。
;
; 本套配色即 D25 之前的硬编码基线，切换过来零视觉回归。

[Variables]
; ---- 文本与轨道 ----
Color=255,255,255,255
TrackColor=255,255,255,48
; ---- 字号（Small=控制按钮 / Body=日历与媒体副标题 / 默认=正文 / Clock=时钟大字）----
FontSize=14
ClockSize=30
FontSizeSmall=12
FontSizeBody=13
FontSizeTitle=15
; ---- 挂件强调色 ----
AccentCPU=90,170,255,255
AccentMemory=120,220,140,255
AccentDisk=255,190,90,255
AccentNet=255,120,160,255
AccentMedia=180,140,255,255
; ---- 音频频谱 8 频段渐变（Band1 低频 → Band8 高频）----
AudioBand1=90,200,255,255
AudioBand2=100,220,235,255
AudioBand3=120,235,210,255
AudioBand4=150,240,180,255
AudioBand5=190,235,150,255
AudioBand6=230,215,130,255
AudioBand7=250,180,140,255
AudioBand8=255,140,170,255

; Dock 侧共用同一份主题（Dock.ini 只声明 [Theme] Name=，不重复写颜色）。
; PanelColor：Duilib bkcolor 口径 #AARRGGBB（40=alpha 64/255，即 25% 不透明黑）。
; Transparency：分层窗口 layeredopacity（0..255），Dock.ini 未显式写 [Dock] Transparency 时采用本值。
[Colors]
PanelColor=#40000000
Transparency=220
