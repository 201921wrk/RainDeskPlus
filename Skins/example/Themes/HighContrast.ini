; RainDeskPlus 主题：HighContrast（高对比 / 无障碍）
; 由 skin.ini / Dock.ini 的 [Theme] Name=HighContrast 声明引用，路径约定：<主文件目录>\Themes\<名>.ini
;
; 合并语义（D26-30）：主题文件是「低优先级默认值」，主文件显式写出的同名键优先。
; 本套用纯色高对比配色 + 放大一档字号，用来验证「主题变量确实能整体覆盖取色与字号」。

[Variables]
; ---- 文本与轨道 ----
Color=255,255,0,255
TrackColor=255,255,255,96
; ---- 字号：整体放大一档，提升可读性 ----
FontSize=15
ClockSize=32
FontSizeSmall=13
FontSizeBody=14
FontSizeTitle=16
; ---- 挂件强调色：高饱和纯色 ----
AccentCPU=0,255,255,255
AccentMemory=0,255,0,255
AccentDisk=255,255,0,255
AccentNet=255,0,255,255
AccentMedia=255,128,0,255
; ---- 音频频谱 8 频段渐变（低→高，青→品红）----
AudioBand1=0,255,255,255
AudioBand2=0,255,180,255
AudioBand3=0,255,90,255
AudioBand4=120,255,0,255
AudioBand5=255,255,0,255
AudioBand6=255,180,0,255
AudioBand7=255,90,120,255
AudioBand8=255,0,255,255

; Dock 面板：不透明纯黑底 + 满不透明度，最大化与图标的对比。
[Colors]
PanelColor=#FF000000
Transparency=255
