; RainDeskPlus 主题：Light（浅底深字）
; 由 skin.ini / Dock.ini 的 [Theme] Name=Light 声明引用，路径约定：<主文件目录>\Themes\<名>.ini
;
; 合并语义（D26-30）：主题文件是「低优先级默认值」，主文件显式写出的同名键优先。
; 浅色背景下文字改用深灰，强调色整体压暗一档以保证对比度；Dock 面板改为浅色半透明。

[Variables]
; ---- 文本与轨道 ----
Color=28,28,34,255
TrackColor=0,0,0,40
; ---- 字号 ----
FontSize=14
ClockSize=30
FontSizeSmall=12
FontSizeBody=13
FontSizeTitle=15
; ---- 挂件强调色（压暗以适配浅底）----
AccentCPU=30,110,220,255
AccentMemory=30,150,80,255
AccentDisk=200,130,20,255
AccentNet=200,50,110,255
AccentMedia=120,80,220,255
; ---- 音频频谱 8 频段渐变（低→高）----
AudioBand1=30,140,220,255
AudioBand2=30,170,200,255
AudioBand3=40,185,160,255
AudioBand4=70,190,120,255
AudioBand5=130,180,80,255
AudioBand6=190,160,40,255
AudioBand7=215,120,40,255
AudioBand8=210,70,110,255

; Dock 面板：浅色半透明（#AARRGGBB，50=alpha 80/255 → 约 31% 不透明白）。
[Colors]
PanelColor=#50F2F2F7
Transparency=235
