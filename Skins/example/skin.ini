; RainDeskPlus 示例皮肤 - CPU 占用率文本挂件
; 演示 INI 配置结构：[Rainmeter] / [Variables] / [Measure*] / [Meter*]
; 工具链就位后可由 Skin::Load 解析、由 ConfigParser 读取。

[Rainmeter]
Update=1000
AccurateText=1
AntiAlias=1
Background=0,0,0,1

[Variables]
FontFace=Segoe UI
FontSize=14
Color=255,255,255,255

[MeasureCPU]
Measure=CPU
Processor=0
MinValue=0
MaxValue=100

[MeterCPUText]
Meter=String
MeasureName=MeasureCPU
Text=CPU: %1%
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#Color#
X=20
Y=20
AntiAlias=1
