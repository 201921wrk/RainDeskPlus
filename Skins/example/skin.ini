; RainDeskPlus 示例皮肤 - 系统监控四合一挂件 + 天气 + 时钟/日历 + 媒体播放 + 音频频谱
; 演示 INI 配置结构：[Rainmeter] / [Variables] / [Measure*] / [Meter*]
; 九类 Measure：CPU / Memory / Disk / Net / Weather / Time / Calendar / Media / Audio；三种 Meter：String / Bar / Line
; 布局为纵向堆叠：每项一行文本 + 一行图形（Bar 或 Line），天气/时钟/日历只有文本，音频频谱只有图形。

[Rainmeter]
Update=1000
AccurateText=1
AntiAlias=1
Background=0,0,0,1

; ---------- 主题声明（D26-30）----------
; 加载本文件时，会把「同目录 Themes\<Name>.ini」并入为低优先级默认值：
; 本文件显式写出的键优先，主题文件只补缺口。改这一行后 !Refresh 即可切换主题。
; 内置三套：Dark（深色基线）/ Light（浅底深字）/ HighContrast（高对比无障碍）。
[Theme]
Name=Dark

; ---------- 皮肤自有参数 ----------
; 只保留「结构 / 字体族」等不随主题变化的项。文字色、轨道色、字号、各挂件强调色
; 与音频频段渐变全部来自 Themes\<名>.ini —— 勿在此重复写死，否则会遮住主题文件。
[Variables]
FontFace=Segoe UI
PanelW=220
; 时钟与日历共用 Consolas / 等宽字体，保证日历网格逐列对齐
MonoFace=Consolas

; ---------- CPU 占用率 ----------

[MeasureCPU]
Measure=CPU
Processor=0
MinValue=0
MaxValue=100

[MeterCPUText]
Meter=String
MeasureName=MeasureCPU
Text=CPU: %1%
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#Color#
X=20
Y=20
AntiAlias=1

[MeterCPUBar]
Meter=Bar
MeasureName=MeasureCPU
BarOrientation=Horizontal
BarColor=#AccentCPU#
SolidColor=#TrackColor#
X=20
Y=44
W=#PanelW#
H=10

; ---------- 内存占用率 ----------

[MeasureMemory]
Measure=Memory
Mode=UsedPercent

[MeterMemoryText]
Meter=String
MeasureName=MeasureMemory
Text=内存: %1%
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#Color#
X=20
Y=70
AntiAlias=1

[MeterMemoryBar]
Meter=Bar
MeasureName=MeasureMemory
BarOrientation=Horizontal
BarColor=#AccentMemory#
SolidColor=#TrackColor#
X=20
Y=94
W=#PanelW#
H=10

; ---------- 磁盘剩余空间（Drive= 指定盘符；未配置退回系统盘） ----------

[MeasureDisk]
Measure=Disk
Drive=C:
Total=0

[MeterDiskText]
Meter=String
MeasureName=MeasureDisk
Text=磁盘 C: 剩余 %1
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#Color#
X=20
Y=120
AntiAlias=1

[MeterDiskBar]
Meter=Bar
MeasureName=MeasureDisk
BarOrientation=Horizontal
BarColor=#AccentDisk#
SolidColor=#TrackColor#
X=20
Y=144
W=#PanelW#
H=10

; ---------- 网络入站速率（无界量纲 → 折线图自动缩放） ----------

[MeasureNet]
Measure=Net
Type=InOctets
Interface=Best

[MeterNetText]
Meter=String
MeasureName=MeasureNet
Text=网络入站: %1 B/s
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#Color#
X=20
Y=170
AntiAlias=1

[MeterNetLine]
Meter=Line
MeasureName=MeasureNet
LineColor=#AccentNet#
LineWidth=1.5
LineCount=60
AutoScale=1
X=20
Y=194
W=#PanelW#
H=40

; ---------- 天气（读取 OpenWeatherMap 缓存报文） ----------
; 本阶段为离线骨架：只解析落地在本皮肤目录下的缓存报文（weather_cache.json），
; 不做联网请求；WinHTTP 拉取与缓存回写为后续阶段，届时 ApiKey 才会真正被使用。

[MeasureWeather]
Measure=Weather
; 留空则回退环境变量 OPENWEATHER_API_KEY；仓库内不放真实 Key
ApiKey=
; 报文缺 name 字段时用该值兜底显示
City=Beijing
; metric=摄氏度（默认）/ imperial=华氏度
Units=metric
; 相对路径按皮肤 INI 所在目录解析 → Skins\example\weather_cache.json
CacheFile=weather_cache.json
; 种子报文是静态的，关闭过期判断以免常驻 "(cache stale)"；联网阶段可按需改回 30
ExpireMinutes=0

[MeterWeatherText]
Meter=String
MeasureName=MeasureWeather
Text=天气: %1
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#Color#
X=20
Y=234
AntiAlias=1

; ---------- 时钟 / 日期 / 星期（三个 MeasureTime，靠 Format= 分工） ----------

[MeasureClock]
Measure=Time
Format=%H:%M:%S

[MeasureDate]
Measure=Time
Format=%Y-%m-%d

[MeasureWeekday]
Measure=Time
Format=%A

[MeterClockText]
Meter=String
MeasureName=MeasureClock
Text=%1
FontFace=#MonoFace#
FontSize=#ClockSize#
FontColor=#Color#
X=20
Y=262
AntiAlias=1

[MeterDateText]
Meter=String
MeasureName=MeasureDate
Text=%1
FontFace=#MonoFace#
FontSize=#FontSize#
FontColor=#Color#
X=20
Y=316
AntiAlias=1

[MeterWeekdayText]
Meter=String
MeasureName=MeasureWeekday
Text=%1
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#Color#
X=20
Y=340
AntiAlias=1

; ---------- 日历（整月网格：表头 + 6 行 × 7 列，一个 String Meter 承载） ----------
; 每格 3 字符宽、列间 1 空格 → 每行 27 字符；等宽字体下逐列对齐。
; 固定 Year/Month 时会展示指定月份；此处不写，即跟随系统当前年月。

[MeasureCalendar]
Measure=Calendar
; 0=周日为一周首日 / 1=周一
WeekStart=1
; 1=在今日格尾追加 TodayMark 标记；0=不标记
HighlightToday=1
TodayMark=*

[MeterCalendarText]
Meter=String
MeasureName=MeasureCalendar
Text=%1
FontFace=#MonoFace#
FontSize=#FontSizeBody#
FontColor=#Color#
X=20
Y=366
AntiAlias=1

; ---------- 媒体播放（标题 / 艺术家 / 状态 + 进度条 + 控制按钮） ----------
; 本阶段为离线骨架：只读本皮肤目录下的媒体会话快照 media_state.json，不连接播放器。
; 进度条绑定 MeasureMediaProgress —— 该 Measure 的 m_Value 恒为「已播秒数 / 总秒数」的
; 0..1 归一化比，量程由 MeasureMedia 自身补 MaxValue=1（MeterBar 要求量程 > 0）。
; 控制走 !CommandMeasure，落到 MeasureMedia::Command() → 广播 WM_APPCOMMAND 媒体键。
; 命令与 Field= 无关，故四个 Measure 中任写一个即可；此处统一用 [MeasureMedia]。
; 该通道的系统指令只有四条且播放/暂停合一，故 Play 是「播放⇄暂停」切换。

[MeasureMedia]
Measure=Media
; 相对路径按皮肤 INI 所在目录解析 → Skins\example\media_state.json
StateFile=media_state.json
Field=Title

[MeasureMediaArtist]
Measure=Media
StateFile=media_state.json
Field=Artist

[MeasureMediaState]
Measure=Media
StateFile=media_state.json
Field=State

[MeasureMediaProgress]
Measure=Media
StateFile=media_state.json
Field=Progress

[MeterMediaTitleText]
Meter=String
MeasureName=MeasureMedia
Text=%1
FontFace=#FontFace#
FontSize=#FontSizeTitle#
FontColor=#Color#
X=20
Y=500
AntiAlias=1

[MeterMediaArtistText]
Meter=String
MeasureName=MeasureMediaArtist
Text=%1
FontFace=#FontFace#
FontSize=#FontSizeBody#
FontColor=#Color#
X=20
Y=524
AntiAlias=1

[MeterMediaBar]
Meter=Bar
MeasureName=MeasureMediaProgress
BarOrientation=Horizontal
BarColor=#AccentMedia#
SolidColor=#TrackColor#
X=20
Y=546
W=#PanelW#
H=8

[MeterMediaStateText]
Meter=String
MeasureName=MeasureMediaState
Text=%1
FontFace=#MonoFace#
FontSize=#FontSizeBody#
FontColor=#Color#
X=20
Y=560
AntiAlias=1

[MeterMediaPrevButton]
Meter=String
Text=PREV
FontFace=#MonoFace#
FontSize=#FontSizeSmall#
FontColor=#Color#
X=20
Y=584
AntiAlias=1
LeftMouseUpAction=!CommandMeasure "MeasureMedia" "Prev"

[MeterMediaPlayButton]
Meter=String
Text=PLAY
FontFace=#MonoFace#
FontSize=#FontSizeSmall#
FontColor=#Color#
X=80
Y=584
AntiAlias=1
LeftMouseUpAction=!CommandMeasure "MeasureMedia" "Play"

[MeterMediaNextButton]
Meter=String
Text=NEXT
FontFace=#MonoFace#
FontSize=#FontSizeSmall#
FontColor=#Color#
X=140
Y=584
AntiAlias=1
LeftMouseUpAction=!CommandMeasure "MeasureMedia" "Next"

; ---------- 音频频谱（8 频段竖向 Bar 阵列） ----------
; 本阶段同为离线骨架：只读本皮肤目录下的 PCM 快照 audio_state.json，不连接声卡采集。
; 每个 Measure 绑定一个频段（Field=Band1..Band8），值域 0..1，由 MeasureAudio 自带的
; MaxValue=1 提供量程（MeterBar 要求量程 > 0，否则一律画 0）。
; 频段按几何级数平分 60Hz..12kHz（每段约一个倍频程），段内取最强 bin 而非均值，
; 这样高段不会因 bin 数多而被稀释。8 根条并排：X = 20 + (N-1) * 25，条宽 23、间隔 2。

[MeasureAudioBand1]
Measure=Audio
; 相对路径按皮肤 INI 所在目录解析 → Skins\example\audio_state.json
AudioFile=audio_state.json
Field=Band1

[MeasureAudioBand2]
Measure=Audio
AudioFile=audio_state.json
Field=Band2

[MeasureAudioBand3]
Measure=Audio
AudioFile=audio_state.json
Field=Band3

[MeasureAudioBand4]
Measure=Audio
AudioFile=audio_state.json
Field=Band4

[MeasureAudioBand5]
Measure=Audio
AudioFile=audio_state.json
Field=Band5

[MeasureAudioBand6]
Measure=Audio
AudioFile=audio_state.json
Field=Band6

[MeasureAudioBand7]
Measure=Audio
AudioFile=audio_state.json
Field=Band7

[MeasureAudioBand8]
Measure=Audio
AudioFile=audio_state.json
Field=Band8

[MeterAudioBand1]
Meter=Bar
MeasureName=MeasureAudioBand1
BarOrientation=Vertical
BarColor=#AudioBand1#
SolidColor=#TrackColor#
X=20
Y=608
W=23
H=60

[MeterAudioBand2]
